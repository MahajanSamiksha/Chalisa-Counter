name: Release

# Builds a signed APK and attaches it to a GitHub Release when you push a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Requires four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   - your .jks, base64 encoded (see README)
#   KEYSTORE_PASSWORD - the store password
#   KEY_ALIAS         - the key alias, e.g. chalisa
#   KEY_PASSWORD      - the key password
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the Release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Write signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove signing material
        # Runs even on failure so credentials never linger in the workspace.
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Rename APK to include the version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/chalisa-counter-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ### Install

            Download the `.apk` below and open it on your Android device
            (Android 7.0 / API 24 or newer).

            Android will ask you to allow installing from an unknown source —
            that is expected for an app distributed outside the Play Store.

            Sideloaded apps do not update automatically. Check back here for
            new versions.
